include:
    - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v1.0.17
      inputs:
          vm-hostname: media.vm.xbhl.intranet
          vm-ssh-username: $SSH_USER
          vm-ssh-private-key: $SSH_PRIVATE_KEY
          service-name: tautulli
          container-name: tautulli
          container-location: /opt/containers/tautulli
          cloudflare-dns-entry-name: tautulli.intranet.xbhl.online
          cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
          cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
          container-healthcheck-delay: 60
          delete-existing-container-files: true

setup:generate-build-artifacts:
    script:
        - cp src/.env $BUILD_ARTIFACTS_DIR
        - echo "PLEX_TOKEN=${PLEX_TOKEN}" >> $BUILD_ARTIFACTS_DIR/.env
