services:
    tautulli:
        container_name: tautulli
        image: ghcr.io/tautulli/tautulli:v2.18.1
        volumes:
            - config:/config
        environment:
            - PUID=1000
            - PGID=988
            - TZ=Europe/Warsaw
        ports:
            - "8181:8181"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.tautulli-router.rule=Host(`tautulli.intranet.xbhl.online`)"
            - "traefik.http.routers.tautulli-router.entrypoints=websecure"
            - "traefik.http.routers.tautulli-router.tls=true"
            - "traefik.http.routers.tautulli-router.service=tautulli"
            - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
            - "traefik.docker.network=proxy"
            - 'wud.watch=true'
            - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
            - "wud.link.template=https://github.com/Tautulli/Tautulli/releases/tag/v$${major}.$${minor}.$${patch}"
        networks:
            - proxy
        restart: unless-stopped

volumes:
    config:

networks:
    proxy:
        external: true
