services:
    tautulli:
        container_name: tautulli
        image: ghcr.io/tautulli/tautulli:${TAUTULLI_VERSION:?err}
        volumes:
            - config:/config
        environment:
            - PUID=${PUID:?err}
            - PGID=${PGID:?err}
            - TZ=${TIME_ZONE:?err}
        ports:
            - ${TAUTULLI_WEB_UI_PORT:?err}:${TAUTULLI_WEB_UI_PORT:?err}
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.tautulli-router.rule=Host(`${TAUTULLI_DOMAIN:?err}`)"
            - "traefik.http.routers.tautulli-router.entrypoints=websecure"
            - "traefik.http.routers.tautulli-router.tls=true"
            - "traefik.http.routers.tautulli-router.service=tautulli"
            - "traefik.http.services.tautulli.loadbalancer.server.url=${TAUTULLI_SCHEMA:?err}://${TAUTULLI_HOST:?err}:${TAUTULLI_WEB_UI_PORT:?err}"
        networks:
            - tautulli
            - proxy
        restart: unless-stopped

volumes:
    config:

networks:
    tautulli:
        name: tautulli-internal-network
    proxy:
        external: true
